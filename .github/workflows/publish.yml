name: publish

# Triggered by the tag that `vbt patch|minor|major` pushes. Runs checkall, then
# publishes to npm via OIDC trusted publishing — no NPM_TOKEN. Configure the
# trusted publisher on npmjs.com (this repo + this workflow) and enable
# "Require two-factor authentication and disallow tokens". Provenance is automatic.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      id-token: write # OIDC trusted publishing + provenance
    steps:
      - uses: actions/checkout@v4
      # Trusted publishing needs npm >= 11.5.1, which Node 24 already ships
      # (24.20 carries npm 11.19). Installing npm@latest on top instead only
      # breaks once npm raises its own engine floor past the Node used here.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          test "$TAG" = "$PKG"
      - run: npm run checkall
      - run: npm publish
      - name: Create GitHub Release
        run: gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
